# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config
#
# Generated by hand for this ZIP (no network access to run `supabase init`
# in this sandbox). Run `supabase init` yourself if you want the CLI's own
# current defaults merged in — this file covers what Module 2 needs.

project_id = "crazycraft"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
# PLACEHOLDER — do NOT trust this value as verified. This was written
# without network access to a real Supabase project or the ability to run
# `supabase init` fresh, so 15 is used here only because it has been the
# longstanding CLI default in Supabase's own documentation examples.
# Before relying on this:
#   - If you already have a hosted Supabase project: run
#     `SHOW server_version;` against it and set major_version to that
#     value's major version number (e.g. 15, 17).
#   - If you don't have a hosted project yet: run `supabase init` in a
#     scratch directory and copy whatever major_version the CLI itself
#     generates — that reflects the actual current default, which may
#     have changed since this file was written.
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.external.google]
enabled = true
client_id = "376724842094-5l6rs7n3m1rmkjan8p8d0qms99487ta4.apps.googleusercontent.com"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false
[analytics]
enabled = false